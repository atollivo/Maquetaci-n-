<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENA - Contacto</title>
<link rel="stylesheet" href="../css/styles_global.css">
<link rel="stylesheet" href="../css/styles_contacto.css">
</head>
<body>

<header class="header">
    <nav class="navbar">
        <h1 class="logo">SENA</h1>
        <div class="menu-toggle">☰</div>
        <ul class="nav-links">
            <li><a href="../Index.html">Inicio</a></li>
            <li><a href="tareas.html">Tareas</a></li>
            <li><a href="progreso.html">Progreso</a></li>
            <li><a href="contacto.html" class="active">Contacto</a></li>
        </ul>
    </nav>
</header>

<main class="container" id="contacto-page">
    <div class="contact-wrapper">
        <section class="contact-info">
            <h2>Hablemos</h2>
            <p>Si tienes dudas sobre el proyecto o necesitas soporte técnico, estamos aquí para ayudarte.</p>
            <ul class="contact-details">
                <li>📍 Centro de Formación SENA</li>
                <li>📧 soporte@sena.edu.co</li>
                <li>📞 +57 300 000 0000</li>
            </ul>
        </section>

        <section class="contact-card">
            <form>
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label>Tu Mensaje</label>
                    <textarea placeholder="¿En qué podemos ayudarte?"></textarea>
                </div>
                <button type="submit" class="btn btn-full">Enviar Mensaje</button>
            </form>
        </section>
    </div>
</main>

<footer class="footer">
    <p>© 2026 SENA</p>
</footer>

<script>
    const toggle = document.querySelector(".menu-toggle");
    const nav = document.querySelector(".nav-links");
    toggle.addEventListener("click", () => {
        nav.classList.toggle("active");
    });
</script>

</body>
</html>
